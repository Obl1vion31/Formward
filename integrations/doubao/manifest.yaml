manifest_version: 2
app_key: db_app_9m6xflq
name: Formward

mcp_server:
  end_point: https://global.formward.top/api/doubao/mcp
  description: 查询本人健康记录，提交由用户网页登录确认的记录预览。
  mcp_config:
    protocol: Streamable
  user_auth:
    fetch_token_url: https://global.formward.top/api/doubao/fetch-token
    refresh_token_url: https://global.formward.top/api/doubao/refresh-token
    delete_userinfo_url: https://global.formward.top/api/doubao/delete-userinfo

tools:
  authorize_formward:
    description: "连接或补齐授权；用户在OAuth页面同意，不读健康数据"
    login_type: normal
    output: { kind: execution_result }
  get_profile:
    description: "查看当前连接账号"
    login_type: normal
    output: { kind: entities, entity_types: [formward_query_result] }
  query_measurements:
    description: "查询实测身体、变化和已计算七日统计"
    login_type: normal
    output: { kind: entities, entity_types: [formward_query_result] }
  preview_measurements:
    description: "仅身体新增或历史修改，可批量；创建待确认预览"
    login_type: normal
    output: { kind: execution_result }
  search_foods:
    description: "先查食材库，取得引用所需foodId、version及规格"
    login_type: normal
    output: { kind: entities, entity_types: [formward_query_result] }
  import_meal_images:
    description: "导入附件；上传成功还不等于关联餐次或保存"
    login_type: normal
    request_timeout: 120000
    output: { kind: execution_result }
  search_exercises:
    description: "查训练动作库和稳定catalogId"
    login_type: normal
    output: { kind: entities, entity_types: [formward_query_result] }
  query_training:
    description: "查模板、计划及实际完成训练，三者分开"
    login_type: normal
    output: { kind: entities, entity_types: [formward_query_result] }
  preview_training:
    description: "仅训练模板及排期，可同批引用新模板；不写实际完成训练"
    login_type: normal
    output: { kind: execution_result }
  query_energy:
    description: "查消耗；热量盈余用includeMeals=true返回服务端联合统计，须饮食和消耗读权限"
    login_type: normal
    output: { kind: entities, entity_types: [formward_query_result] }
  query_meals:
    description: "查已有饮食、记全状态及服务端摄入合计、均值和范围"
    login_type: normal
    output: { kind: entities, entity_types: [formward_query_result] }
  preview_meals:
    description: "只新增餐次，meals数组可一餐或多餐；不修改已有餐、不自动入食材库。先确定实际食量，再估算营养。仅有食物名称、没有实际数量时先集中追问，不自行设定克数或默认1份，不创建预览后再让用户纠正；食材规格不代表本次吃了多少。已报克数、毫升、个数等数量时保留，可注明常见规格估算营养，不强求克重。默认估算热量及蛋白质、碳水、脂肪，不逐次问是否估算；营养估算不代表用户接受食量估算。估算填sourceKind=estimated及basis；用户明确只记录或确实无法合理估算时保留未知。用户说加／补／追加食物时，先query_meals取目标日details；有对应餐次用preview_meal_changes.changes[].addFoods，仅无匹配或明确另记一餐才新增。 估算数值须填营养字段，不能只写basis；每参考量营养优先交服务器换算。"
    login_type: normal
    output: { kind: execution_result }
  preview_energy:
    description: "仅消耗或已完成运动的新建／修改预览，days数组可多日；不是训练计划"
    login_type: normal
    output: { kind: execution_result }
  preview_meal_changes:
    description: "只修改已保存餐次，changes数组使用mealId/version及局部修改；不是待审草稿修改。先确定实际食量，再估算营养。仅有食物名称、没有实际数量时先集中追问，不自行设定克数或默认1份，不创建预览后再让用户纠正；食材规格不代表本次吃了多少。已报克数、毫升、个数等数量时保留，可注明常见规格估算营养，不强求克重。默认估算热量及蛋白质、碳水、脂肪，不逐次问是否估算；营养估算不代表用户接受食量估算。估算填sourceKind=estimated及basis；用户明确只记录或确实无法合理估算时保留未知。用户说加／补／追加食物时，先query_meals取目标日details；有对应餐次用preview_meal_changes.changes[].addFoods，仅无匹配或明确另记一餐才新增。 估算数值须填营养字段，不能只写basis；每参考量营养优先交服务器换算。"
    login_type: normal
    output: { kind: execution_result }
  preview_foods:
    description: "仅维护本人食材库，foods数组；不表示今天吃过，用户明确要求入库才使用"
    login_type: normal
    output: { kind: execution_result }
  preview_record_bundle:
    description: "至少两类功能动作组合成一个预览，如身体＋饮食；单一功能用专用入口。先确定实际食量，再估算营养。仅有食物名称、没有实际数量时先集中追问，不自行设定克数或默认1份，不创建预览后再让用户纠正；食材规格不代表本次吃了多少。已报克数、毫升、个数等数量时保留，可注明常见规格估算营养，不强求克重。默认估算热量及蛋白质、碳水、脂肪，不逐次问是否估算；营养估算不代表用户接受食量估算。估算填sourceKind=estimated及basis；用户明确只记录或确实无法合理估算时保留未知。用户说加／补／追加食物时，先query_meals取目标日details；有对应餐次用preview_meal_changes.changes[].addFoods，仅无匹配或明确另记一餐才新增。 估算数值须填营养字段，不能只写basis；每参考量营养优先交服务器换算。"
    login_type: normal
    output: { kind: execution_result }
  get_preview:
    description: "查询任意本人预览的最新版本、待补项与逐项保存状态；pending未正式保存"
    login_type: normal
    output: { kind: execution_result }
  update_preview:
    description: "只修改已有待审草稿：原id/revision、项目key及局部变化；补照片、漏项沿用原链接"
    login_type: normal
    output: { kind: execution_result }

entities:
  formward_query_result:
    schema:
      entity_id: { type: string, description: 本账号及查询范围的稳定结果编号，不是记录编号。, is_entity_id: true }
      entity_type: { type: string, llm_visible: false }
      domain: { type: string, description: 查询类别。 }
      result_json: { type: string, description: 原业务查询结果的完整 JSON；保留日期、真实记录编号、版本、来源、空值和明确零。 }

permissions: []
