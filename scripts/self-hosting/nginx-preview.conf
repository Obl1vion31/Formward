# formward-self-hosting-managed-v1
server {
    listen 127.0.0.1:8080 default_server;
    server_name 127.0.0.1 localhost;

    access_log off;
    error_log /var/log/nginx/formward-preview-error.log crit;
    client_max_body_size 21m;
    client_body_timeout 120s;
    send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host 127.0.0.1:3300;
        proxy_set_header X-Forwarded-Host 127.0.0.1:3300;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port 3300;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
