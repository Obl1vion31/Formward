# 备案域名入口；与现有 IP／海外签名回源配置并存。
server {
    listen 80;
    server_name formward.top www.formward.top;
    access_log off;
    error_log /var/log/nginx/formward-domain-error.log crit;
    return 308 https://formward.top$request_uri;
}
server {
    listen 443 ssl;
    server_name www.formward.top;
    ssl_certificate /etc/formward/tls/current/fullchain.pem;
    ssl_certificate_key /etc/formward/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/formward-domain-error.log crit;
    return 308 https://formward.top$request_uri;
}
server {
    listen 443 ssl;
    server_name formward.top;
    ssl_certificate /etc/formward/tls/current/fullchain.pem;
    ssl_certificate_key /etc/formward/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;
    limit_req zone=formward_api burst=100 nodelay;
    limit_req zone=formward_actions burst=50 nodelay;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/formward-domain-error.log crit;
    add_header X-Content-Type-Options nosniff always;
    add_header Retry-After $formward_retry_after always;
    add_header Referrer-Policy same-origin always;
    location = /api/meal-images/upload {
        client_body_timeout 660s;
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host formward.top;
        proxy_set_header X-Forwarded-Host formward.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host formward.top;
        proxy_set_header X-Forwarded-Host formward.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
