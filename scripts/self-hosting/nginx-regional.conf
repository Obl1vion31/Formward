# formward-managed-regional-v1
# 备案前仅回环8443；80/443 公网监听必须另行验收后启用。
server {
    listen 127.0.0.1:8443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
}
server {
    listen 127.0.0.1:8443 ssl;
    server_name formward.top www.formward.top cn.formward.top origin.formward.top;
    ssl_certificate /etc/formward/tls/current/fullchain.pem;
    ssl_certificate_key /etc/formward/tls/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    error_log /var/log/nginx/formward-regional-error.log crit;
    client_max_body_size 21m;
    client_body_timeout 120s;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
