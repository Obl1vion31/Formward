# formward-managed-security-v1 — 安装到Nginx http上下文（conf.d）。
# 静态文件不消耗接口额度，真实用户额度在应用验签后按账号共享计数。
map $uri $formward_api_limit_key {
    default "";
    ~^/api/ $binary_remote_addr;
}
map $http_next_action $formward_action_limit_key {
    "" "";
    default $binary_remote_addr;
}
limit_req_zone $formward_api_limit_key zone=formward_api:10m rate=20r/s;
limit_req_zone $formward_action_limit_key zone=formward_actions:10m rate=10r/s;
limit_req_status 429;
map $status $formward_retry_after { default ""; 429 "60"; }
